        window.handleManualCodeJoin = async function(e) {
            e.preventDefault();
            const raw = document.getElementById('input-join-code').value.trim().toUpperCase();
            if (!raw) return;

                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        foundPoll = docSnap.data();
                        if (!Array.isArray(foundPoll.responses)) foundPoll.responses = [];
                        state.polls[foundPoll.id] = foundPoll;
                    }
                } catch (err) {
                    console.warn('Single-fetch poll error:', err);
                }
            }

            if (!foundPoll) {
                showToast(`Poll "${raw}" not found. Check the code on screen.`, 'warning');

            }
